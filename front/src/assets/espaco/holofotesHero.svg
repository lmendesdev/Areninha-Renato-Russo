<svg
  width="1440"
  height="500"
  viewBox="0 0 1440 500"
  preserveAspectRatio="none"
  fill="none"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <radialGradient id="haloCentral" cx="50%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#FFD600" stop-opacity="0.24" />
      <stop offset="36%" stop-color="#FFE664" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#FFE664" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloEsquerdo" cx="25%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#00D2FF" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="haloDireito" cx="75%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0" />
    </radialGradient>

    <linearGradient
      id="feixeCentralDourado"
      x1="720"
      y1="0"
      x2="720"
      y2="500"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#FFD600" stop-opacity="0.32" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.16" />
      <stop offset="85%" stop-color="#FFF0A0" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFF0A0" stop-opacity="0" />
    </linearGradient>

    <linearGradient
      id="feixeDiagonalEsquerdo"
      x1="135"
      y1="0"
      x2="520"
      y2="500"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#00D2FF" stop-opacity="0.28" />
      <stop offset="45%" stop-color="#3B82F6" stop-opacity="0.14" />
      <stop offset="88%" stop-color="#3B82F6" stop-opacity="0" />
    </linearGradient>

    <linearGradient
      id="feixeDiagonalDireito"
      x1="1305"
      y1="0"
      x2="920"
      y2="500"
      gradientUnits="userSpaceOnUse"
    >
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.26" />
      <stop offset="45%" stop-color="#A855F7" stop-opacity="0.13" />
      <stop offset="88%" stop-color="#A855F7" stop-opacity="0" />
    </linearGradient>

    <filter id="desfoqueFeixe" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" />
    </filter>

    <filter id="desfoqueCanhao" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <rect width="1440" height="500" fill="url(#haloCentral)" />
  <rect width="1440" height="500" fill="url(#haloEsquerdo)" />
  <rect width="1440" height="500" fill="url(#haloDireito)" />

  <polygon
    points="669,0 771,0 1181,500 259,500"
    fill="url(#feixeCentralDourado)"
  />

  <polygon
    points="72,0 198,0 744,500 296,500"
    fill="url(#feixeDiagonalEsquerdo)"
    filter="url(#desfoqueFeixe)"
  />

  <polygon
    points="1242,0 1368,0 1144,500 696,500"
    fill="url(#feixeDiagonalDireito)"
    filter="url(#desfoqueFeixe)"
  />

  <rect
    x="632"
    y="-4"
    width="176"
    height="12"
    rx="6"
    fill="#FFD600"
    fill-opacity="0.8"
    filter="url(#desfoqueCanhao)"
  />
  <rect
    x="86"
    y="-3"
    width="96"
    height="9"
    rx="4.5"
    fill="#00D2FF"
    fill-opacity="0.75"
    filter="url(#desfoqueCanhao)"
  />
  <rect
    x="1258"
    y="-3"
    width="96"
    height="9"
    rx="4.5"
    fill="#EC4899"
    fill-opacity="0.75"
    filter="url(#desfoqueCanhao)"
  />
</svg>
